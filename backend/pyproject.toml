[project]
name = "traveo-backend"
version = "1.0.0"
description = "Traveo — AI-Powered Shared Ride Platform Backend"
requires-python = ">=3.11"
dependencies = [
    # --- Web Framework ---
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",

    # --- Supabase ---
    "supabase>=2.5.0",

    # --- Validation & Serialization ---
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",

    # --- Security ---
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.0",

    # --- HTTP Client ---
    "httpx>=0.27.0",

    # --- Redis ---
    "redis[hiredis]>=5.0.0",

    # --- Background Tasks ---
    "celery>=5.4.0",
    "apscheduler>=3.10.0",

    # --- Logging ---
    "structlog>=24.2.0",

    # --- Payments ---
    "razorpay>=1.4.0",

    # --- Firebase ---
    "firebase-admin>=6.5.0",

    # --- Utilities ---
    "python-dateutil>=2.9.0",
    "phonenumbers>=8.13.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S101", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.setuptools]
packages = ["app"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
