# ============================================================
# Traveo — CI/CD Pipeline (GitHub Actions)
# ============================================================

name: Traveo CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Backend ──────────────────────────────────────────────
  backend-lint-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: |
          ruff check app/
          ruff format --check app/

      - name: Type check (MyPy)
        run: mypy app/ --ignore-missing-imports
        continue-on-error: true

      - name: Run tests
        run: |
          pytest tests/ --cov=app --cov-report=xml -v
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          JWT_SECRET: test-secret-for-ci-min-32-chars!!

  # ── Security Scan ────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: backend-lint-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r backend/pyproject.toml
        continue-on-error: true

  # ── Docker Build ─────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: backend-lint-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: |
          docker build -t traveo-api:${{ github.sha }} backend/

      - name: Verify image
        run: |
          docker run --rm traveo-api:${{ github.sha }} python -c "print('Image OK')"
